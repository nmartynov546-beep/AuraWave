[package]
name = "aurawave"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "AuraWave"
path = "src/main.rs"

[dependencies]
tao = "0.37.3"
wry = "0.57.3"
tray-icon = "0.26.1"
muda = "0.21.2"
webview2-com = "0.39.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.62"
ureq = { version = "2", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
